<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Labeled healthcare technology deployment photograph</title>
  <desc id="desc">Original two-bay deployment photograph with three text labels and six restrained leader lines.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#07130f" flood-opacity="0.35"/>
    </filter>
    <marker id="pointer" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="5.8" markerHeight="5.8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2.6 5 Z" fill="#d6ff43" stroke="#082f2b" stroke-width="1.25"/>
    </marker>
  </defs>

  <!-- Untouched original photograph, cropped only at the ceiling and far-right bay. -->
  <image href="dialysis-system-in-use.jpg" x="0" y="-287" width="1969" height="1311" preserveAspectRatio="none"/>

  <!-- Restrained leader lines. The photograph and equipment remain untouched. -->
  <g fill="none" stroke="#082f2b" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.68">
    <path d="M 250 136 C 338 170, 438 220, 532 292"/>
    <path d="M 348 136 C 478 160, 608 210, 730 310"/>
    <path d="M 662 162 C 640 218, 594 300, 490 390"/>
    <path d="M 848 162 C 856 252, 824 350, 758 414"/>
    <path d="M 230 842 C 292 740, 394 634, 526 562"/>
  </g>

  <g fill="none" stroke="#f7f6ef" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pointer)">
    <!-- Adjustable mechanical arms -->
    <path d="M 250 136 C 338 170, 438 220, 532 292"/>
    <path d="M 348 136 C 478 160, 608 210, 730 310"/>

    <!-- Medical-grade touchscreens -->
    <path d="M 662 162 C 640 218, 594 300, 490 390"/>
    <path d="M 848 162 C 856 252, 824 350, 758 414"/>

    <!-- Network, power and cabling -->
    <path d="M 230 842 C 292 740, 394 634, 526 562"/>
  </g>

  <!-- Subtle evidence outlines keep the small infrastructure details legible. -->
  <g fill="none" stroke="#d6ff43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.76">
    <rect x="525" y="535" width="41" height="43" rx="5"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="19.5" font-weight="700" letter-spacing="2" fill="#f8f7f2" filter="url(#shadow)">
    <g transform="translate(112 54)">
      <rect width="300" height="82" fill="#0b3f3a" fill-opacity="0.96" stroke="#d9dfd8" stroke-width="1.35"/>
      <rect width="10" height="82" fill="#d6ff43"/>
      <text x="30" y="34">ADJUSTABLE</text>
      <text x="30" y="63">MECHANICAL ARMS</text>
    </g>

    <g transform="translate(638 80)">
      <rect width="300" height="82" fill="#0b3f3a" fill-opacity="0.96" stroke="#d9dfd8" stroke-width="1.35"/>
      <rect width="10" height="82" fill="#d6ff43"/>
      <text x="30" y="34">MEDICAL-GRADE</text>
      <text x="30" y="63">TOUCHSCREENS</text>
    </g>

    <g transform="translate(118 842)">
      <rect width="300" height="82" fill="#0b3f3a" fill-opacity="0.96" stroke="#d9dfd8" stroke-width="1.35"/>
      <rect width="10" height="82" fill="#d6ff43"/>
      <text x="30" y="34">NETWORK, POWER</text>
      <text x="30" y="63">&amp; CABLING</text>
    </g>
  </g>
</svg>
